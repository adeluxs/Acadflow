<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Test - UniFlow</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4f46e5">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">PWA Test Page</h1>
        
        <!-- Status indicators -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-4 rounded-lg shadow">
                <p class="text-sm text-gray-600">Online Status</p>
                <p id="online-status" class="text-xl font-bold"></p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <p class="text-sm text-gray-600">SW Status</p>
                <p id="sw-status" class="text-xl font-bold"></p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <p class="text-sm text-gray-600">Sync Queue</p>
                <p id="sync-queue" class="text-xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <p class="text-sm text-gray-600">Installable</p>
                <p id="install-status" class="text-xl font-bold">No</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-xl font-bold mb-4">Actions</h2>
            <div class="space-y-3">
                <button onclick="checkServiceWorker()" class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Check Service Worker
                </button>
                <button onclick="testCache()" class="w-full px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                    Test Cache API
                </button>
                <button onclick="testIndexedDB()" class="w-full px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">
                    Test IndexedDB
                </button>
                <button onclick="queueTestAction()" class="w-full px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700">
                    Queue Test Action
                </button>
                <button onclick="syncNow()" class="w-full px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700">
                    Sync Now
                </button>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">Results</h2>
            <pre id="output" class="bg-gray-100 p-4 rounded text-sm overflow-auto max-h-64"></pre>
        </div>
    </div>

    <script src="/js/sync-manager.js"></script>
    <script>
        // Update status
        function updateStatus() {
            document.getElementById('online-status').textContent = navigator.onLine ? 'Online' : 'Offline';
            document.getElementById('online-status').className = 'text-xl font-bold ' + (navigator.onLine ? 'text-green-600' : 'text-red-600');
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        // Check Service Worker
        async function checkServiceWorker() {
            const output = document.getElementById('output');
            
            if (!('serviceWorker' in navigator)) {
                output.textContent = 'Service Worker not supported';
                return;
            }

            try {
                const registration = await navigator.serviceWorker.ready;
                output.textContent = JSON.stringify({
                    active: registration.active ? 'Yes' : 'No',
                    waiting: registration.waiting ? 'Yes' : 'No',
                    installing: registration.installing ? 'Yes' : 'No',
                    scope: registration.scope,
                }, null, 2);
                
                document.getElementById('sw-status').textContent = registration.active ? 'Active' : 'Inactive';
                document.getElementById('sw-status').className = 'text-xl font-bold ' + (registration.active ? 'text-green-600' : 'text-red-600');
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        // Test Cache API
        async function testCache() {
            const output = document.getElementById('output');
            
            try {
                const cache = await caches.open('test-cache');
                await cache.put('/test', new Response('Hello from cache!'));
                const response = await cache.match('/test');
                const text = await response.text();
                output.textContent = 'Cache API works! Response: ' + text;
            } catch (error) {
                output.textContent = 'Cache API error: ' + error.message;
            }
        }

        // Test IndexedDB
        async function testIndexedDB() {
            const output = document.getElementById('output');
            
            try {
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('TestDB', 1);
                    request.onupgradeneeded = (e) => {
                        const db2 = e.target.result;
                        db2.createObjectStore('test', { keyPath: 'id' });
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                
                output.textContent = 'IndexedDB works!';
                db.close();
            } catch (error) {
                output.textContent = 'IndexedDB error: ' + error.message;
            }
        }

        // Queue test action
        async function queueTestAction() {
            const output = document.getElementById('output');
            
            if (!window.syncManager) {
                output.textContent = 'SyncManager not loaded';
                return;
            }

            try {
                await window.syncManager.queueAction('/api/test', 'POST', { test: true });
                output.textContent = 'Action queued!';
                updateSyncQueue();
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
            }
        }

        // Sync now
        async function syncNow() {
            const output = document.getElementById('output');
            
            if (!window.syncManager) {
                output.textContent = 'SyncManager not loaded';
                return;
            }

            try {
                await window.syncManager.syncAll();
                output.textContent = 'Sync completed!';
            } catch (error) {
                output.textContent = 'Sync error: ' + error.message;
            }
        }

        // Update sync queue count
        async function updateSyncQueue() {
            if (!window.syncManager) return;
            
            try {
                const actions = await window.syncManager.getQueuedActions();
                document.getElementById('sync-queue').textContent = actions.length;
            } catch (error) {
                console.error('Error updating queue:', error);
            }
        }

        // Listen for install prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-status').textContent = 'Yes';
            document.getElementById('install-status').className = 'text-xl font-bold text-green-600';
        });

        // Check SW on load
        checkServiceWorker();
        updateSyncQueue();

        // Listen for sync events
        if (window.syncManager) {
            window.syncManager.addListener((event, data) => {
                const output = document.getElementById('output');
                output.textContent = `Sync event: ${event}\n${JSON.stringify(data, null, 2)}`;
                updateSyncQueue();
            });
        }
    </script>
</body>
</html>
